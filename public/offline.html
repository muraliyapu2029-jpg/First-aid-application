<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RakshaAI — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030712;
      color: white;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    p { color: #9ca3af; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1rem; }
    .call-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: #dc2626; color: white; font-weight: 700;
      padding: 1rem 2rem; border-radius: 1rem; font-size: 1.25rem;
      text-decoration: none; margin-top: 1rem;
    }
    .note { color: #f59e0b; font-size: 0.8rem; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="icon">📵</div>
  <h1>RakshaAI — Offline</h1>
  <p>You are currently offline. First-aid instructions available if you visited this page before.</p>
  <p>For immediate emergency assistance:</p>
  <a href="tel:112" class="call-btn">📞 Call 112</a>
  <p class="note">⚠️ This app provides first-aid guidance only. Always seek professional medical care.</p>
</body>
</html>
