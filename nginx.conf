server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the optional backend container.
    # Resolving at request time (via Docker's DNS) lets nginx start even
    # when the backend profile isn't running — /api then returns 502 and
    # the app falls back to the browser's speech recognizer.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://backend:4000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 3m;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
