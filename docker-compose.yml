version: '3.8'

services:
  # Frontend — React app served by nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
        VITE_OVERPASS_API_URL: ${VITE_OVERPASS_API_URL:-https://overpass-api.de/api/interpreter}
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend — Express API skeleton (optional, for future integrations)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - GEMINI_API_KEY=${VITE_GEMINI_API_KEY:-}
    profiles:
      - with-backend

networks:
  default:
    name: raksha-network
